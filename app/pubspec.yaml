name: bookit
description: "BookIt — free, open-source e-reader that translates books into your language, on your own device."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  path_provider: ^2.1.5
  path: ^1.9.0
  archive: ^3.6.1
  xml: ^6.5.0
  file_picker: ^11.0.3
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  wakelock_plus: ^1.2.8
  onnxruntime: ^1.4.1
  ffi: ^2.1.0
  characters: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
