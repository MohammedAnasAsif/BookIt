# Developer tool: downloads the translation model in CI and records reference
# data (tokenizer structure, ONNX inputs/outputs, reference translations).
# Results are pushed to the `ci-logs` branch.
name: Engine probe

on:
  workflow_dispatch:
  push:
    paths:
      - tools/probe/**
      - .github/workflows/probe.yml

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            ort: "onnxruntime==1.15.1 'numpy<2'"
            extra: ""
            name: ort115
          - python: "3.12"
            ort: "onnxruntime"
            extra: "torch --index-url https://download.pytorch.org/whl/cpu"
            name: ortlatest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          pip install -q "transformers>=4.44,<5" sentencepiece protobuf huggingface_hub ${{ matrix.ort }} 2>&1 | tail -3
          if [ -n "${{ matrix.extra }}" ]; then pip install -q ${{ matrix.extra }} 2>&1 | tail -3; fi
          python -c "import numpy, onnxruntime; print('numpy', numpy.__version__, 'ort', onnxruntime.__version__)"
      - name: Decoder probe
        run: set -o pipefail; python tools/probe/decoder_probe.py 2>&1 | tee tools/probe/out/decoder-log-${{ matrix.name }}.txt
      - name: Tokenizer probe
        if: matrix.name == 'ortlatest'
        run: set -o pipefail; python tools/probe/nllb_probe.py 2>&1 | tail -40 | tee tools/probe/out/nllb-log.txt
      - name: Publish results to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r tools/probe/out/* /tmp/pub/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin ci-logs && git checkout -q -B ci-logs origin/ci-logs || { git checkout -q --orphan ci-logs && git rm -rf -q . ; }
            mkdir -p probe/out && cp -r /tmp/pub/* probe/out/
            git add -A probe && git commit -qm "probe ${{ matrix.name }} ${{ github.run_id }}" || exit 0
            git push -q origin ci-logs && exit 0
            sleep $((attempt * 3)); git reset -q --hard
          done
