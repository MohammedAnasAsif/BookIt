# Rebuilds the bundled Project Gutenberg catalog and featured shelves
# (app/assets/catalog.json.gz, app/assets/featured.json). Runs monthly.
name: Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: [main]
    paths:
      - tools/build_catalog.py
      - .github/workflows/catalog.yml

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build catalog
        run: |
          set -o pipefail
          mkdir -p catalog-log
          python tools/build_catalog.py app/assets 2>&1 | tee catalog-log/log.txt
          ls -la app/assets
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/catalog.json.gz app/assets/featured.json
          git diff --cached --quiet || (git commit -m "Update bundled book catalog" && git pull --rebase -q && git push -q)
      - name: Publish logs
        if: always()
        run: bash .github/scripts/publish-logs.sh "catalog-${{ github.run_id }}" catalog-log/log.txt
